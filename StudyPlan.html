<script>
/* ===== STRUKTUR DATA & LOGIKA (sesuai Diagram Kelas) ===== */

/* Min-Heap berbasis array. push/pop O(log n), peek O(1). */
class MinHeap {
  constructor(lebih_kecil) { this.data = []; this.jumlah = 0; this.lk = lebih_kecil; }
  push(x) {
    this.data[this.jumlah] = x; this.jumlah++;
    let i = this.jumlah - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.lk(this.data[i], this.data[p])) { [this.data[i], this.data[p]] = [this.data[p], this.data[i]]; i = p; }
      else break;
    }
  }
  peek() { return this.jumlah ? this.data[0] : null; }
  pop() {
    if (!this.jumlah) return null;
    const atas = this.data[0];
    this.jumlah--;
    const akhir = this.data.pop();
    if (this.jumlah) {
      this.data[0] = akhir;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < this.jumlah && this.lk(this.data[l], this.data[m])) m = l;
        if (r < this.jumlah && this.lk(this.data[r], this.data[m])) m = r;
        if (m === i) break;
        [this.data[i], this.data[m]] = [this.data[m], this.data[i]]; i = m;
      }
    }
    return atas;
  }
  /* Urutan lengkap tanpa merusak heap: salin lalu pop berulang. O(n log n) */
  terurut() {
    const c = new MinHeap(this.lk); c.data = this.data.slice(); c.jumlah = this.jumlah;
    const out = []; while (c.jumlah) out.push(c.pop()); return out;
  }
}

const ms = (s) => new Date(s).getTime();

/* AntrianPrioritas: tenggat terdekat, lalu kesulitan tertinggi */
class AntrianPrioritas extends MinHeap {
  constructor() {
    super((a, b) => { const da = ms(a.tenggat), db = ms(b.tenggat); return da !== db ? da < db : a.kesulitan > b.kesulitan; });
  }
  static dari(tugasList) { const h = new AntrianPrioritas(); tugasList.forEach(t => h.push(t)); return h; }
}

/* AntrianPengingat: waktu pengingat terdekat */
class AntrianPengingat extends MinHeap {
  constructor() { super((a, b) => ms(a.waktu_pengingat) < ms(b.waktu_pengingat)); }
  static dari(list) { const h = new AntrianPengingat(); list.forEach(p => h.push(p)); return h; }
}

const pad = (n) => String(n).padStart(2, '0');
const fmtLokal = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtTgl = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const HARI_MS = 86400000;

/* PenyimpananJSON: 4 "berkas" JSON, dimuat saat dibuka, disimpan tiap perubahan */
class PenyimpananJSON {
  constructor(adapter) {
    this.berkas_matkul = 'matkul.json'; this.berkas_tugas = 'tugas.json';
    this.berkas_jadwal = 'jadwal.json'; this.berkas_pengingat = 'pengingat.json';
    this.adapter = adapter || PenyimpananJSON.localStorageAdapter();
    this.matkul = []; this.tugas = []; this.jadwal = []; this.pengingat = [];
  }
  static localStorageAdapter() {
    return {
      baca(k) { try { return localStorage.getItem('studyplan:' + k); } catch (e) { return null; } },
      tulis(k, v) { try { localStorage.setItem('studyplan:' + k, v); } catch (e) {} }
    };
  }
  static memoriAdapter() { const m = {}; return { baca: k => m[k] ?? null, tulis: (k, v) => { m[k] = v; } }; }
  _baca(nama) { try { const r = this.adapter.baca(nama); const v = r ? JSON.parse(r) : null; return Array.isArray(v) ? v : null; } catch (e) { return null; } }
  muat_semua() {
    const m = this._baca(this.berkas_matkul), t = this._baca(this.berkas_tugas),
          j = this._baca(this.berkas_jadwal), p = this._baca(this.berkas_pengingat);
    this.baru = (m === null && t === null && j === null);
    this.matkul = m || []; this.tugas = t || []; this.jadwal = j || []; this.pengingat = p || [];
    return this;
  }
  simpan_semua() {
    this.adapter.tulis(this.berkas_matkul, JSON.stringify(this.matkul, null, 2));
    this.adapter.tulis(this.berkas_tugas, JSON.stringify(this.tugas, null, 2));
    this.adapter.tulis(this.berkas_jadwal, JSON.stringify(this.jadwal, null, 2));
    this.adapter.tulis(this.berkas_pengingat, JSON.stringify(this.pengingat, null, 2));
  }
  ekspor() { return JSON.stringify({ matkul: this.matkul, tugas: this.tugas, jadwal: this.jadwal, pengingat: this.pengingat }, null, 2); }
  impor(teks) {
    const o = JSON.parse(teks);
    if (!o || !Array.isArray(o.matkul) || !Array.isArray(o.tugas) || !Array.isArray(o.jadwal)) throw new Error('Format berkas tidak sesuai');
    this.matkul = o.matkul; this.tugas = o.tugas; this.jadwal = o.jadwal; this.pengingat = Array.isArray(o.pengingat) ? o.pengingat : [];
  }
}

/* PembersihOtomatis: dijalankan saat aplikasi dibuka */
class PembersihOtomatis {
  constructor(simpanan) { this.s = simpanan; this.waktu_sekarang = new Date(); }
  hapus_tugas_lewat_tenggat() {
    const ada = new Set(), n = this.waktu_sekarang.getTime(); let hapus = 0;
    this.s.tugas = this.s.tugas.filter(t => { const lewat = ms(t.tenggat) < n; if (lewat) hapus++; return !lewat; });
    this.s.tugas.forEach(t => ada.add(t.id_tugas));
    this.s.pengingat = this.s.pengingat.filter(p => ada.has(p.id_tugas));
    return hapus;
  }
  hapus_jadwal_lewat() {
    const n = this.waktu_sekarang.getTime(); let hapus = 0;
    this.s.jadwal = this.s.jadwal.filter(j => { const lewat = ms(`${j.tanggal}T${j.jam_selesai || '23:59'}`) < n; if (lewat) hapus++; return !lewat; });
    return hapus;
  }
  jalankan_saat_aplikasi_dibuka() {
    this.waktu_sekarang = new Date();
    return { tugas: this.hapus_tugas_lewat_tenggat(), jadwal: this.hapus_jadwal_lewat() };
  }
}

/* Aplikasi: CRUD + heap diisi ulang dari JSON saat dibuka */
class Aplikasi {
  constructor(adapter) {
    this.simpanan = new PenyimpananJSON(adapter);
    this.pembersih = new PembersihOtomatis(this.simpanan);
    this.laporan = { tugas: 0, jadwal: 0 };
  }
  buka() {
    this.simpanan.muat_semua();
    this.laporan = this.pembersih.jalankan_saat_aplikasi_dibuka();
    this.bangun_heap();
    this.simpanan.simpan_semua();
    return this;
  }
  /* Aturan 7 */
  bangun_heap() {
    const s = this.simpanan;
    this.antrian_tugas = AntrianPrioritas.dari(s.tugas.filter(t => t.status !== 'selesai'));
    this.antrian_pengingat = AntrianPengingat.dari(s.pengingat);
  }
  _id(awalan, daftar, kunci) {
    let n = daftar.reduce((m, x) => Math.max(m, parseInt(String(x[kunci]).slice(awalan.length), 10) || 0), 0) + 1;
    return awalan + pad(n).padStart(awalan === 'T' ? 3 : 2, '0');
  }
  _simpan() { this.bangun_heap(); this.simpanan.simpan_semua(); }

  /* --- MataKuliah --- */
  daftar_matkul() { return this.simpanan.matkul.slice(); }
  tambah_matkul(nama) {
    nama = (nama || '').trim(); if (!nama) throw new Error('Nama mata kuliah wajib diisi');
    const m = { id_matkul: this._id('M', this.simpanan.matkul, 'id_matkul'), nama_matkul: nama };
    this.simpanan.matkul.push(m); this._simpan(); return m;
  }
  ubah_matkul(id, nama) {
    const m = this.simpanan.matkul.find(x => x.id_matkul === id); if (!m) throw new Error('Mata kuliah tidak ditemukan');
    nama = (nama || '').trim(); if (!nama) throw new Error('Nama mata kuliah wajib diisi');
    m.nama_matkul = nama;
    this._simpan(); return m;
  }
  hapus_matkul(id) {
    const s = this.simpanan;
    const idT = new Set(s.tugas.filter(t => t.id_matkul === id).map(t => t.id_tugas));
    s.matkul = s.matkul.filter(m => m.id_matkul !== id);
    s.tugas = s.tugas.filter(t => t.id_matkul !== id);
    s.pengingat = s.pengingat.filter(p => !idT.has(p.id_tugas));
    s.jadwal.forEach(j => { if (j.id_matkul === id) j.id_matkul = ''; });
    this._simpan();
  }

  /* --- Tugas --- */
  _cek_tugas(d) {
    if (!(d.judul || '').trim()) throw new Error('Judul tugas wajib diisi');
    if (!d.tenggat || isNaN(ms(d.tenggat))) throw new Error('Tenggat wajib diisi');
    const k = Number(d.kesulitan); if (![1, 2, 3].includes(k)) throw new Error('Kesulitan harus 1 sampai 3');
    return k;
  }
  tambah_tugas(d) {
    const k = this._cek_tugas(d);
    const t = { id_tugas: this._id('T', this.simpanan.tugas, 'id_tugas'), id_matkul: d.id_matkul || '', judul: d.judul.trim(),
      sumber: (d.sumber || '').trim(), tenggat: d.tenggat, kesulitan: k, status: 'belum' };
    this.simpanan.tugas.push(t);
    this.tambah_pengingat(t.id_tugas, this.hitung_waktu_pengingat(t.tenggat));
    this._simpan(); return t;
  }
  ubah_tugas(id, d) {
    const t = this.simpanan.tugas.find(x => x.id_tugas === id); if (!t) throw new Error('Tugas tidak ditemukan');
    const k = this._cek_tugas(d); const tenggatBerubah = t.tenggat !== d.tenggat;
    Object.assign(t, { id_matkul: d.id_matkul || '', judul: d.judul.trim(), sumber: (d.sumber || '').trim(), tenggat: d.tenggat, kesulitan: k });
    if (tenggatBerubah && t.status !== 'selesai') {   /* Aturan 6 */
      const p = this.simpanan.pengingat.find(x => x.id_tugas === id);
      const w = this.hitung_waktu_pengingat(t.tenggat);
      if (p) p.waktu_pengingat = w; else this.tambah_pengingat(id, w);
    }
    this._simpan(); return t;
  }
  hapus_tugas(id) {
    this.simpanan.tugas = this.simpanan.tugas.filter(t => t.id_tugas !== id);
    this.simpanan.pengingat = this.simpanan.pengingat.filter(p => p.id_tugas !== id);
    this._simpan();
  }
  tandai_selesai(id) {
    const t = this.simpanan.tugas.find(x => x.id_tugas === id); if (!t) return;
    t.status = t.status === 'selesai' ? 'belum' : 'selesai';
    this.simpanan.pengingat = this.simpanan.pengingat.filter(p => p.id_tugas !== id);   /* Aturan 6 */
    if (t.status === 'belum') this.tambah_pengingat(id, this.hitung_waktu_pengingat(t.tenggat));
    this._simpan(); return t;
  }
  lihat_tugas_terdekat() { return this.antrian_tugas.peek(); }          /* O(1) */
  tampil_urut_tenggat() { return this.antrian_tugas.terurut(); }         /* heap */
  cari_tugas(kata) {
    kata = (kata || '').trim().toLowerCase(); if (!kata) return this.tampil_urut_tenggat();
    const nama = (id) => (this.simpanan.matkul.find(m => m.id_matkul === id) || {}).nama_matkul || '';
    return this.tampil_urut_tenggat().filter(t => (t.judul + ' ' + t.sumber + ' ' + nama(t.id_matkul)).toLowerCase().includes(kata));
  }

  /* --- Pengingat (Aturan 5) --- */
  hitung_waktu_pengingat(tenggat) {
    const h2 = ms(tenggat) - 2 * HARI_MS, sekarang = Date.now();
    return fmtLokal(new Date(h2 > sekarang ? h2 : sekarang));
  }
  tambah_pengingat(id_tugas, waktu) {
    const p = { id_pengingat: this._id('R', this.simpanan.pengingat, 'id_pengingat'), id_tugas, waktu_pengingat: waktu };
    this.simpanan.pengingat.push(p); return p;
  }
  ubah_pengingat(id, waktu) {
    const p = this.simpanan.pengingat.find(x => x.id_pengingat === id); if (!p) throw new Error('Pengingat tidak ditemukan');
    if (!waktu || isNaN(ms(waktu))) throw new Error('Waktu pengingat tidak valid');
    p.waktu_pengingat = waktu; this._simpan(); return p;
  }
  hapus_pengingat(id) { this.simpanan.pengingat = this.simpanan.pengingat.filter(p => p.id_pengingat !== id); this._simpan(); }
  /* cek_pengingat: ambil semua yang waktunya sudah tiba, dari heap, urut terdekat */
  cek_pengingat(waktu_sekarang = new Date()) {
    const h = AntrianPengingat.dari(this.simpanan.pengingat), jatuh = [];
    while (h.peek() && ms(h.peek().waktu_pengingat) <= waktu_sekarang.getTime()) jatuh.push(h.pop());
    return jatuh;
  }

  /* --- Jadwal --- */
  _cek_jadwal(d) {
    if (!(d.nama_kegiatan || '').trim()) throw new Error('Nama kegiatan wajib diisi');
    if (!d.tanggal) throw new Error('Tanggal wajib diisi');
    if (!d.jam_mulai || !d.jam_selesai) throw new Error('Jam mulai dan selesai wajib diisi');
    if (d.jam_selesai <= d.jam_mulai) throw new Error('Jam selesai harus setelah jam mulai');
  }
  tambah_jadwal(d) {
    this._cek_jadwal(d);
    const j = { id_jadwal: this._id('J', this.simpanan.jadwal, 'id_jadwal'), id_matkul: d.id_matkul || '', nama_kegiatan: d.nama_kegiatan.trim(),
      tanggal: d.tanggal, jam_mulai: d.jam_mulai, jam_selesai: d.jam_selesai };
    this.simpanan.jadwal.push(j); this._simpan(); return j;
  }
  ubah_jadwal(id, d) {
    const j = this.simpanan.jadwal.find(x => x.id_jadwal === id); if (!j) throw new Error('Jadwal tidak ditemukan');
    this._cek_jadwal(d);
    Object.assign(j, { id_matkul: d.id_matkul || '', nama_kegiatan: d.nama_kegiatan.trim(), tanggal: d.tanggal, jam_mulai: d.jam_mulai, jam_selesai: d.jam_selesai });
    this._simpan(); return j;
  }
  hapus_jadwal(id) { this.simpanan.jadwal = this.simpanan.jadwal.filter(j => j.id_jadwal !== id); this._simpan(); }
  _urut_jadwal(l) { return l.sort((a, b) => (a.tanggal + a.jam_mulai).localeCompare(b.tanggal + b.jam_mulai)); }
  tampil_jadwal_hari_ini() { const t = fmtTgl(new Date()); return this._urut_jadwal(this.simpanan.jadwal.filter(j => j.tanggal === t)); }
  tampil_jadwal_mingguan() {
    const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(a.getTime() + 6 * HARI_MS);
    return this._urut_jadwal(this.simpanan.jadwal.filter(j => j.tanggal >= fmtTgl(a) && j.tanggal <= fmtTgl(b)));
  }
  /* Agenda hari ini: jadwal + tugas yang tenggatnya hari ini, digabung & diurut waktu */
  tampil_agenda_hari_ini() {
    const t = fmtTgl(new Date());
    const a = this.tampil_jadwal_hari_ini().map(j => ({ jenis: 'jadwal', waktu: j.jam_mulai, ref: j }));
    this.simpanan.tugas.filter(x => x.status !== 'selesai' && x.tenggat.slice(0, 10) === t)
      .forEach(x => a.push({ jenis: 'tugas', waktu: x.tenggat.slice(11, 16), ref: x }));
    return a.sort((x, y) => x.waktu.localeCompare(y.waktu));
  }
  nama_matkul(id) { return (this.simpanan.matkul.find(m => m.id_matkul === id) || {}).nama_matkul || 'Tanpa mata kuliah'; }
}

  const m0 = e && S.edit.id ? s.matkul.find(x => x.id_matkul === S.edit.id) : { nama_matkul: '' };
  const form = e ? `<form class="card" id="formMatkul" data-id="${S.edit.id || ''}" style="margin-bottom:14px"><h2>${S.edit.id ? 'Ubah Mata Kuliah' : 'Tambah Mata Kuliah'}</h2>
    <div class="form"><div class="field"><label for="m-nama">Nama mata kuliah</label><input id="m-nama" name="nama" value="${esc(m0.nama_matkul)}" placeholder="Contoh: Struktur Data" autocomplete="off"></div>
    <div class="row"><button class="btn pri" type="submit">Simpan</button><button class="btn" type="button" data-act="batal">Batal</button></div>
    <div class="err full" role="alert">${esc(S.err)}</div></div></form>` : '';
  const baris = s.matkul.map(m => { const nt = s.tugas.filter(t => t.id_matkul === m.id_matkul).length, nj = s.jadwal.filter(j => j.id_matkul === m.id_matkul).length;
    return `<li class="item"><div class="body"><div class="t">${esc(m.nama_matkul)}</div><div class="m"><span class="mono">${m.id_matkul}</span><span>${nt} tugas</span><span>${nj} jadwal</span></div></div>
    <div class="acts"><button class="btn sm" data-act="ubah-matkul" data-id="${m.id_matkul}">Ubah</button><button class="btn sm danger" data-act="hapus-matkul" data-id="${m.id_matkul}">Hapus</button></div></li>`; }).join('');
  return `<div class="top"><div><h1>Mata Kuliah</h1><p>Isi di awal semester. Daftar ini menjadi pilihan saat menambah tugas dan jadwal.</p></div><button class="btn pri" data-act="tambah-matkul">+ Tambah Mata Kuliah</button></div>
    ${form}<div class="card"><ul class="list">${baris || '<li class="empty">Belum ada mata kuliah.</li>'}</ul></div>
    <p class="note">Menghapus mata kuliah ikut menghapus tugas dan pengingatnya. Jadwalnya tetap ada tanpa mata kuliah.</p>`;
}

function layarPengingat() {
  const s = app.simpanan, h = AntrianPengingat.dari(s.pengingat), urut = h.terurut(), tiba = new Set(app.cek_pengingat().map(p => p.id_pengingat));
  const baris = urut.map(p => { const t = s.tugas.find(x => x.id_tugas === p.id_tugas); if (!t) return '';
    const ubah = S.edit && S.edit.jenis === 'pengingat' && S.edit.id === p.id_pengingat;
    return `<li class="item"><div class="body"><div class="t">${esc(t.judul)}</div>
      <div class="m"><span>${esc(app.nama_matkul(t.id_matkul))}</span><span>Tenggat ${fmtJam(t.tenggat)}</span>${tiba.has(p.id_pengingat) ? '<span class="pill soon">Sudah waktunya</span>' : ''}</div>
      ${ubah ? `<form id="formIngat" data-id="${p.id_pengingat}" class="row" style="margin-top:8px"><input id="p-waktu" name="waktu" type="datetime-local" class="search" style="flex:0 1 220px" value="${p.waktu_pengingat}" aria-label="Waktu pengingat"><button class="btn sm pri" type="submit">Simpan</button><button class="btn sm" type="button" data-act="batal">Batal</button><span class="err">${esc(S.err)}</span></form>`
      : `<div class="m" style="margin-top:2px"><span>Mengingatkan: <b>${fmtJam(p.waktu_pengingat)}</b></span></div>`}</div>
      <div class="acts"><button class="btn sm" data-act="ubah-ingat" data-id="${p.id_pengingat}">Ubah waktu</button><button class="btn sm danger" data-act="hapus-ingat" data-id="${p.id_pengingat}">Hapus</button></div></li>`; }).join('');
  return `<div class="top"><div><h1>Pengingat</h1><p>Dibuat otomatis H-2 sebelum tenggat. Jika H-2 sudah lewat, pengingat dibuat saat tugas ditambahkan.</p></div></div>
    <div class="card"><ul class="list">${baris || '<li class="empty">Belum ada pengingat. Pengingat muncul saat Anda menambah tugas.</li>'}</ul></div>
    <p class="note">Urutan diambil dari AntrianPengingat (min-heap): waktu pengingat terdekat di atas.</p>`;
}

/* ---- visualisasi heap ---- */
function arrayHeap(h, label) {
  if (!h.jumlah) return '<div class="empty">Heap kosong.</div>';
  return `<div class="arr" role="img" aria-label="Isi array ${label}">${h.data.map((x, i) => `<div class="cell${i === 0 ? ' root' : ''}"><i>[${i}]</i><b>${esc(label === 'tugas' ? x.id_tugas : x.id_pengingat)}</b></div>`).join('')}</div>`;
}
function pohonHeap(h, kunci) {
  const n = Math.min(h.jumlah, 15); if (!n) return '';
  const dalam = Math.floor(Math.log2(n)) + 1, W = Math.max(300, Math.pow(2, dalam - 1) * 56), H = dalam * 62 + 20;
  const pos = (i) => { const d = Math.floor(Math.log2(i + 1)), k = i + 1 - Math.pow(2, d); return [W * (k + .5) / Math.pow(2, d), 28 + d * 62]; };
  let g = '';
  for (let i = 1; i < n; i++) { const [x1, y1] = pos(i), [x2, y2] = pos((i - 1) >> 1); g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
  for (let i = 0; i < n; i++) { const [x, y] = pos(i); g += `<circle cx="${x}" cy="${y}" r="21" class="${i === 0 ? 'r' : ''}"/><text x="${x}" y="${y + 4}" text-anchor="middle">${esc(h.data[i][kunci])}</text>`; }
  return `<div class="tree"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pohon min-heap">${g}</svg></div>${h.jumlah > 15 ? '<p class="note">Menampilkan 15 simpul pertama.</p>' : ''}`;
}
let berkasDipilih = 'tugas';
function layarData() {
  const s = app.simpanan, at = app.antrian_tugas, ap = app.antrian_pengingat;
  const map = { matkul: s.matkul, tugas: s.tugas, jadwal: s.jadwal, pengingat: s.pengingat };
  const nama = { matkul: s.berkas_matkul, tugas: s.berkas_tugas, jadwal: s.berkas_jadwal, pengingat: s.berkas_pengingat };
  return `<div class="top"><div><h1>Struktur Data</h1><p>Isi heap dan berkas JSON yang dipakai aplikasi ini.</p></div></div>
    <div class="grid g2">
      <div class="card"><h2>AntrianPrioritas (min-heap tugas)</h2><p class="note" style="margin:0 0 8px">Urutan: tenggat, lalu kesulitan tertinggi. push O(log n), peek O(1), pop O(log n). Jumlah: ${at.jumlah}</p>${arrayHeap(at, 'tugas')}${pohonHeap(at, 'id_tugas')}</div>
      <div class="card"><h2>AntrianPengingat (min-heap pengingat)</h2><p class="note" style="margin:0 0 8px">Urutan: waktu pengingat terdekat. Jumlah: ${ap.jumlah}</p>${arrayHeap(ap, 'pengingat')}${pohonHeap(ap, 'id_pengingat')}</div>
      <div class="card" style="grid-column:1/-1"><h2>Berkas JSON</h2>
        <div class="row" style="margin-bottom:10px"><div class="seg" role="group" aria-label="Pilih berkas">${Object.keys(map).map(k => `<button data-act="berkas" data-id="${k}" aria-pressed="${k === berkasDipilih}">${nama[k]}</button>`).join('')}</div>
        <span class="note" style="margin:0">${map[berkasDipilih].length} data</span></div>
        <pre class="json" tabindex="0">${esc(JSON.stringify(map[berkasDipilih], null, 2))}</pre></div>
      <div class="card" style="grid-column:1/-1"><h2>Cadangan data</h2>
        <p class="note" style="margin:0 0 10px">Data disimpan di penyimpanan browser ini. Salin JSON untuk cadangan, atau pilih berkas JSON untuk memulihkan.</p>
        <div class="row"><button class="btn" data-act="salin">Salin semua JSON</button>
          <label class="btn" for="impor" style="cursor:pointer">Impor berkas JSON</label><input id="impor" type="file" accept=".json,application/json" hidden>
          <button class="btn" data-act="contoh">Isi data contoh</button><button class="btn danger" data-act="reset">Hapus semua data</button></div>
        <div class="err" role="alert">${esc(S.err)}</div></div></div>`;
}

/* ---- render ---- */
function render() {
  const s = app.simpanan, jum = { tugas: s.tugas.filter(t => t.status !== 'selesai').length, jadwal: app.tampil_jadwal_hari_ini().length, matkul: s.matkul.length, pengingat: s.pengingat.length };
  const nav = LAYAR.map(([k, n]) => `<button data-act="nav" data-id="${k}" ${S.layar === k ? 'aria-current="page"' : ''}>${n}${jum[k] !== undefined ? `<span class="n">${jum[k]}</span>` : ''}</button>`).join('');
  const tabs = LAYAR.filter(([k]) => k !== 'matkul').map(([k, n]) => `<button data-act="nav" data-id="${k}" ${S.layar === k ? 'aria-current="page"' : ''}>${ikon(k)}${k === 'data' ? 'Data' : n}</button>`).join('');
  const body = { beranda: layarBeranda, tugas: layarTugas, jadwal: layarJadwal, matkul: layarMatkul, pengingat: layarPengingat, data: layarData }[S.layar]();
  const fokus = document.activeElement && document.activeElement.id === 'cari';
  $('#root').innerHTML = `<div class="app"><aside class="side"><div class="brand"><div class="logo">SP</div><div><b>StudyPlan</b><small>Tugas dan jadwal mahasiswa</small></div></div>
    <nav class="nav" aria-label="Menu utama">${nav}</nav><button class="theme" data-act="tema">Ganti tema</button></aside>
    <main>${body}</main></div><nav class="tabs" aria-label="Menu utama">${tabs}</nav>${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  const c = fokus && $('#cari'); if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
}
function pindah(l) { S.layar = l; S.edit = null; S.err = ''; render(); window.scrollTo(0, 0); }
function formData(f) { return Object.fromEntries(new FormData(f).entries()); }

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'nav': return pindah(id);
    case 'tema': { const r = document.documentElement, gelap = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme:dark)').matches); r.dataset.theme = gelap ? 'light' : 'dark'; return; }
    case 'tambah-tugas': S.layar = 'tugas'; S.edit = { jenis: 'tugas', id: '' }; S.err = ''; render(); return $('#f-judul') && $('#f-judul').focus();
    case 'ubah-tugas': S.layar = 'tugas'; S.edit = { jenis: 'tugas', id }; S.err = ''; render(); return window.scrollTo(0, 0);
    case 'hapus-tugas': return aksi(() => app.hapus_tugas(id), 'Tugas dihapus');
    case 'selesai': case 'selesai-btn': return aksi(() => app.tandai_selesai(id), 'Status tugas diperbarui');
    case 'tambah-jadwal': S.layar = 'jadwal'; S.edit = { jenis: 'jadwal', id: '' }; S.err = ''; render(); return $('#j-nama') && $('#j-nama').focus();
    case 'ubah-jadwal': S.edit = { jenis: 'jadwal', id }; S.err = ''; return render();
    case 'hapus-jadwal': return aksi(() => app.hapus_jadwal(id), 'Jadwal dihapus');
    case 'tab-jadwal': S.tabJadwal = id; return render();
    case 'tambah-matkul': S.edit = { jenis: 'matkul', id: '' }; S.err = ''; render(); return $('#m-nama') && $('#m-nama').focus();
    case 'ubah-matkul': S.edit = { jenis: 'matkul', id }; S.err = ''; return render();
    case 'hapus-matkul': return aksi(() => app.hapus_matkul(id), 'Mata kuliah dihapus');
    case 'ubah-ingat': S.edit = { jenis: 'pengingat', id }; S.err = ''; return render();
    case 'hapus-ingat': return aksi(() => app.hapus_pengingat(id), 'Pengingat dihapus');
    case 'tutup-ingat': S.tutup.add(id); return render();
    case 'batal': S.edit = null; S.err = ''; return render();
    case 'berkas': berkasDipilih = id; return render();
    case 'salin': return navigator.clipboard.writeText(app.simpanan.ekspor()).then(() => toast('JSON disalin'), () => { S.err = 'Browser menolak menyalin. Pilih teks pada tampilan berkas secara manual.'; render(); });
    case 'contoh': return aksi(() => { app.simpanan.matkul = []; app.simpanan.tugas = []; app.simpanan.jadwal = []; app.simpanan.pengingat = []; dataContoh(app); }, 'Data contoh dimuat');
    case 'reset': if (el.dataset.sure) { return aksi(() => { Object.assign(app.simpanan, { matkul: [], tugas: [], jadwal: [], pengingat: [] }); app._simpan(); }, 'Semua data dihapus'); }
      el.dataset.sure = '1'; el.textContent = 'Tekan lagi untuk menghapus'; return setTimeout(() => { el.textContent = 'Hapus semua data'; delete el.dataset.sure; }, 3000);
  }
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault(); const f = ev.target, d = formData(f), id = f.dataset.id;
  if (f.id === 'formTugas') aksi(() => { id ? app.ubah_tugas(id, d) : app.tambah_tugas(d); S.edit = null; }, id ? 'Tugas diperbarui' : 'Tugas ditambahkan, pengingat H-2 dibuat');
  else if (f.id === 'formJadwal') aksi(() => { id ? app.ubah_jadwal(id, d) : app.tambah_jadwal(d); S.edit = null; }, id ? 'Jadwal diperbarui' : 'Jadwal ditambahkan');
  else if (f.id === 'formMatkul') aksi(() => { id ? app.ubah_matkul(id, d.nama) : app.tambah_matkul(d.nama); S.edit = null; }, id ? 'Mata kuliah diperbarui' : 'Mata kuliah ditambahkan');
  else if (f.id === 'formIngat') aksi(() => { app.ubah_pengingat(id, d.waktu); S.edit = null; }, 'Pengingat diperbarui');
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'cari') { S.cari = ev.target.value; const sel = app.simpanan.tugas.filter(t => t.status === 'selesai' && (!S.cari || (t.judul + t.sumber).toLowerCase().includes(S.cari.toLowerCase())));
    $('#listTugas').innerHTML = isiListTugas(app.cari_tugas(S.cari), sel); }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id !== 'impor' || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => aksi(() => { app.simpanan.impor(String(r.result)); app.pembersih.jalankan_saat_aplikasi_dibuka(); app._simpan(); }, 'Data diimpor');
  r.readAsText(ev.target.files[0]);
});
setInterval(() => { if (!S.edit && (S.layar === 'beranda' || S.layar === 'pengingat')) render(); }, 60000);
render();
</script>

</body></html>
